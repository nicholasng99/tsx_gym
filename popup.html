<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TSX Gym Booker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
<main class="card">
  <header class="titlebar">
    <h1>TSX Gym Booker</h1>
    <button class="icon-btn" id="open-settings" title="Settings" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
    </button>
  </header>

  <div id="setup-warning" class="warn hidden">
    Profile not set up yet. <a href="#" id="open-options">Open settings</a>.
  </div>

  <div class="cal-header">
    <button class="icon-btn" id="prev-month" title="Previous month">&lsaquo;</button>
    <span id="month-label"></span>
    <button class="icon-btn" id="next-month" title="Next month">&rsaquo;</button>
  </div>
  <div class="cal-grid" id="calendar"></div>
  <p class="hint"><span class="swatch booked"></span> booked &nbsp; <span class="swatch pending"></span> queued &nbsp;·&nbsp; closes 4 pm the working day before</p>

  <ul id="selected" class="selected"></ul>

  <div class="actions">
    <select id="slot" title="Time slot for the selected days"></select>
    <button id="book" disabled>Book</button>
    <button class="secondary" id="clear" title="Clear selection">Clear</button>
  </div>

  <details class="pane" id="queue-pane">
    <summary>Job queue <span id="queue-count" class="count"></span></summary>
    <ul id="queue" class="queue"></ul>
  </details>
</main>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
