<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Popup preview</title>
  <style>
    body { margin: 0; padding: 24px; background: #e9e6e2; font: 13px system-ui, sans-serif; }
    iframe { width: 320px; height: 560px; border: 0; background: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, .15); }
  </style>
</head>
<body>
  <iframe id="popup" title="Popup"></iframe>
  <script>
    // Load the real popup.html and slip the chrome stub in ahead of its scripts.
    fetch("/popup.html")
      .then((r) => r.text())
      .then((html) => {
        document.getElementById("popup").srcdoc = html
          .replace(/(src|href)="(?!https?:|#)/g, '$1="/')
          .replace('<script src="/config.js">', '<script src="/.claude/preview/chrome-stub.js"><\/script><script src="/config.js">');
      });
  </script>
</body>
</html>
