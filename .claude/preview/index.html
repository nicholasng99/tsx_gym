<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Popup preview</title>
  <style>
    body { margin: 0; padding: 24px; background: #e9e6e2; font: 13px system-ui, sans-serif; }
    iframe { width: 320px; height: 560px; border: 0; background: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, .15); }
  </style>
</head>
<body>
  <iframe id="popup" title="Popup"></iframe>
  <script>
    // Load the real popup.html (or options.html with ?page=options) and slip
    // the chrome stub in ahead of its scripts. Every file gets a fresh query
    // string so edits show up on reload.
    const page = new URLSearchParams(location.search).get("page") === "options" ? "options" : "popup";
    if (page === "options") document.getElementById("popup").style.width = "600px";
    const v = Date.now();
    fetch(`/${page}.html`, { cache: "no-store" })
      .then((r) => r.text())
      .then((html) => {
        document.getElementById("popup").srcdoc = html
          .replace('<script src="config.js">', '<script src=".claude/preview/chrome-stub.js"><\/script><script src="config.js">')
          .replace(/(src|href)="(?!https?:|#)([^"]+)"/g, `$1="/$2?v=${v}"`);
      });
  </script>
</body>
</html>
